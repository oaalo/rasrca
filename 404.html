<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جاري التوجيه...</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(145deg, #0d0d0d 0%, #1a0808 50%, #0d0d0d 100%);
            color: #f5d742;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            direction: rtl;
            text-align: center;
        }
        .loader {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(245, 215, 66, 0.15);
            border-top: 4px solid #f5d742;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        p {
            font-size: 1.1rem;
            color: #f5d742;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="loader"></div>
    <p>⏳ جاري التوجيه...</p>

    <script>
        // 1) نحفظ الرابط الأصلي (مثل /rasrca/laws) في ذاكرة المتصفح المؤقتة
        sessionStorage.setItem('redirectPath', window.location.pathname);

        // 2) نعيد التوجيه إلى الصفحة الرئيسية
        window.location.replace('/rasrca/');
    </script>
</body>
</html>
