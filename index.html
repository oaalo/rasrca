    <script>
        // ============================================================

        const canvas = document.getElementById('waveCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let waveOffset = 0;
        const waves = [
            { amplitude: 20, frequency: 0.018, speed: 0.5, color: 'rgba(230, 57, 70, 0.3)' },
            { amplitude: 12, frequency: 0.028, speed: 0.7, color: 'rgba(230, 57, 70, 0.25)' },
            { amplitude: 28, frequency: 0.009, speed: 0.35, color: 'rgba(230, 57, 70, 0.2)' },
        ];

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight * 0.35;
            canvas.style.height = height + 'px';
        }

        function drawWaves() {
            ctx.clearRect(0, 0, width, height);
            waveOffset += 0.012;
            waves.forEach((wave, index) => {
                ctx.beginPath();
                ctx.moveTo(0, height);
                for (let x = 0; x <= width; x++) {
                    const y = height / 2 +
                        Math.sin(x * wave.frequency + waveOffset * wave.speed + index * 1.8) * wave.amplitude +
                        Math.sin(x * wave.frequency * 0.6 + waveOffset * wave.speed * 0.8 + index * 1.2) * (wave
                        .amplitude * 0.5);
                    ctx.lineTo(x, y);
                }
                ctx.lineTo(width, height);
                ctx.closePath();
                ctx.fillStyle = wave.color;
                ctx.fill();
            });
            requestAnimationFrame(drawWaves);
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        drawWaves();

                    setTimeout(() => { entry.target.classList.add('visible'); }, index * 120);
                    revealObserver.unobserve(entry.target);
                }
            });
        }, { threshold: 0.15, rootMargin: '0px 0px -50px 0px' });
        cards.forEach(card => revealObserver.observe(card));

                        var d = Math.floor(startDistance / (1000 * 60 * 60 * 24));
                        var h = Math.floor((startDistance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                        var m = Math.floor((startDistance % (1000 * 60 * 60)) / (1000 * 60));
                        var s = Math.floor((startDistance % (1000 * 60)) / 1000);
                        startCd.innerHTML = '<span>' + String(d).padStart(2, '0') + ' <span class="label">يوم</span></span>' +
                            '<span>' + String(h).padStart(2, '0') + ' <span class="label">ساعة</span></span>' +
                            '<span>' + String(m).padStart(2, '0') + ' <span class="label">دقيقة</span></span>' +
                            '<span>' + String(s).padStart(2, '0') + ' <span class="label">ثانية</span></span>';
                    }
                }
                var endDistance = endDate - now;
                var endCd = document.getElementById('endCountdown');
                var endMsg = document.getElementById('endMessage');
                if (endCd && endMsg) {
                    if (endDistance < 0) { endCd.style.display = 'none';
                        endMsg.style.display = 'block'; } else {
                        endCd.style.display = 'flex';
                        endMsg.style.display = 'none';
                        var d = Math.floor(endDistance / (1000 * 60 * 60 * 24));
                        var h = Math.floor((endDistance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                        var m = Math.floor((endDistance % (1000 * 60 * 60)) / (1000 * 60));
                        var s = Math.floor((endDistance % (1000 * 60)) / 1000);
                        endCd.innerHTML = '<span>' + String(d).padStart(2, '0') + ' <span class="label">يوم</span></span>' +
                            '<span>' + String(h).padStart(2, '0') + ' <span class="label">ساعة</span></span>' +
                            '<span>' + String(m).padStart(2, '0') + ' <span class="label">دقيقة</span></span>' +
                            '<span>' + String(s).padStart(2, '0') + ' <span class="label">ثانية</span></span>';
                    }
                }
            }
            setInterval(updateCountdowns, 1000);
            updateCountdowns();
        })();

        // ============================================================
        // 5. الأسئلة (Firebase)
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyBL4fLkegnhfcqYnE2s4dCihlWdo2ZuvPc",
            authDomain: "rasrca-qa.firebaseapp.com",
            databaseURL: "https://rasrca-qa-default-rtdb.firebaseio.com",
            projectId: "rasrca-qa",
            storageBucket: "rasrca-qa.firebasestorage.app",
            messagingSenderId: "623639667803",
            appId: "1:623639667803:web:0d8c96dc0ac5e622b88b7e"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const auth = firebase.auth();

        auth.signInAnonymously().then(() => {
            console.log("✅ Firebase ready");
            loadQuestions();
        }).catch((error) => {
            document.getElementById('questionsList').innerHTML = `
                <div style="text-align:center;color:#ff6b6b;padding:30px 10px;">
                    <i class="fas fa-exclamation-triangle" style="color:#e63946;font-size:2rem;display:block;margin-bottom:10px;"></i>
                    فشل الاتصال بقاعدة البيانات.
                </div>
            `;
        });

        function addQuestion() {
            const name = document.getElementById('questionAuthor').value.trim();
            const text = document.getElementById('questionText').value.trim();
            if (!name || !text) { alert('الرجاء إدخال الاسم والسؤال.'); return; }
            database.ref('questions').push({ name, text, time: new Date().toISOString(), replies: {} })
                .then(() => { document.getElementById('questionAuthor').value = '';
                    document.getElementById('questionText').value = ''; })
                .catch((error) => { alert("خطأ في الإرسال: " + error.message); });
        }

        function addReply(questionId) {
            const form = document.getElementById('replyForm_' + questionId);
            if (!form) return;
            const nameInput = form.querySelector('.reply-name');
            const textInput = form.querySelector('.reply-text');
            const name = nameInput ? nameInput.value.trim() : '';
            const text = textInput ? textInput.value.trim() : '';
            if (!name || !text) { alert('الرجاء إدخال الاسم والرد.'); return; }
            database.ref('questions/' + questionId + '/replies').push({ name, text, time: new Date().toISOString() })
                .then(() => {
                    form.classList.remove('active');
                    if (nameInput) nameInput.value = '';
                    if (textInput) textInput.value = '';
                })
                .catch((error) => { alert("خطأ في إرسال الرد: " + error.message); });
        }

        function toggleReplyForm(questionId) {
            const form = document.getElementById('replyForm_' + questionId);
            if (!form) return;
            document.querySelectorAll('.reply-form.active').forEach(f => { if (f.id !== form.id) f.classList.remove('active'); });
            form.classList.toggle('active');
        }

        function loadQuestions() {
            database.ref('questions').on('value', (snapshot) => {
                const data = snapshot.val();
                const list = document.getElementById('questionsList');
                if (!data) {
                    list.innerHTML =
                        `<div style="text-align:center;color:#94a3b8;padding:30px 10px;"><i class="fas fa-comment-slash" style="color:#64748b;font-size:2rem;display:block;margin-bottom:10px;"></i>لا توجد أسئلة بعد. كن أول من يسأل!</div>`;
                    return;
                }
                let html = '';
                const keys = Object.keys(data).reverse();
                for (const key of keys) {
                    const q = data[key];
                    const qAvatar = q.name ? q.name.charAt(0).toUpperCase() : '?';
                    const qTime = q.time ? new Date(q.time).toLocaleString('ar-SA') : '';
                    html += `
                        <div class="question-item" id="question_${key}">
                            <div class="q-header">
                                <div class="q-avatar">${qAvatar}</div>
                                <div class="q-name">${escapeHtml(q.name || 'مجهول')}</div>
                                <div class="q-time"><i class="far fa-clock"></i> ${qTime}</div>
                            </div>
                            <div class="q-text">${escapeHtml(q.text || '')}</div>
                            <div class="q-actions">
                                <button onclick="toggleReplyForm('${key}')"><i class="fas fa-reply"></i> رد</button>
                            </div>
                            <div class="reply-form" id="replyForm_${key}">
                                <div class="field"><input type="text" class="reply-name" placeholder="اسمك" /></div>
                                <div class="field"><textarea class="reply-text" placeholder="اكتب ردك هنا..."></textarea></div>
                                <button class="btn-reply" onclick="addReply('${key}')"><i class="fas fa-paper-plane"></i> إرسال الرد</button>
                                <button class="btn-cancel" onclick="toggleReplyForm('${key}')">إلغاء</button>
                            </div>
                            <div class="replies-container">
                                ${renderReplies(q.replies)}
                            </div>
                        </div>
                    `;
                }
                list.innerHTML = html;
            });
        }

        function renderReplies(replies) {
            if (!replies) return '';
            let html = '';
            for (const key of Object.keys(replies)) {
                const r = replies[key];
                const rAvatar = r.name ? r.name.charAt(0).toUpperCase() : '?';
                const rTime = r.time ? new Date(r.time).toLocaleString('ar-SA') : '';
                html += `
                    <div class="reply-item">
                        <div class="reply-header">
                            <div class="reply-avatar">${rAvatar}</div>
                            <div class="reply-name">${escapeHtml(r.name || 'مجهول')}</div>
                            <div class="reply-time"><i class="far fa-clock"></i> ${rTime}</div>
                        </div>
                        <div class="reply-text">${escapeHtml(r.text || '')}</div>
                    </div>
                `;
            }
            return html;
        }

        function escapeHtml(text) { if (!text) return ''; const d = document.createElement('div');
            d.textContent = text; return d.innerHTML; }

        // ============================================================
        // 6. أداة توليد الأكواد
        // ============================================================
        function populateNumberSelect() {
            const select = document.getElementById('numberSelect');
            if (!select) return;
            const ranges = [{ start: 1, end: 10, label: '1-10' }, { start: 11, end: 19, label: '11-19' }, { start: 21,
                    end: 29, label: '21-29' }, { start: 31, end: 39, label: '31-39' }];
            let html = '';
            ranges.forEach(range => {
                html += `<optgroup label="── ${range.label} ──">`;
                for (let i = range.start; i <= range.end; i++) {
                    const formatted = String(i).padStart(2, '0');
                    html += `<option value="${formatted}">${formatted}</option>`;
                }
                html += `</optgroup>`;
            });
            select.innerHTML += html;
        }

        function updateResult() {
            const role = document.getElementById('roleSelect').value;
            const number = document.getElementById('numberSelect').value || '';
            const idCode = document.getElementById('idCode').value.trim() || '';
            const r1 = document.getElementById('result1');
            const r2 = document.getElementById('result2');
            const b1 = document.getElementById('copyBtn1');
            const b2 = document.getElementById('copyBtn2');
            const isComplete = role && number && idCode;
            if (!isComplete) {
                r1.textContent = 'اختر البيانات لإنشاء الكود';
                r1.className = 'code-text placeholder';
                r2.textContent = 'اختر البيانات لإنشاء الكود';
                r2.className = 'code-text placeholder';
                b1.disabled = true;
                b2.disabled = true;
                return;
            }
            r1.textContent = `/nameinradio [${idCode}] [${number}] ${role}`;
            r1.className = 'code-text';
            r2.textContent = `[${idCode}] [${number}] ${role}`;
            r2.className = 'code-text';
            b1.disabled = false;
            b2.disabled = false;
            document.querySelectorAll('.copy-btn').forEach(btn => { btn.classList.remove('copied');
                btn.innerHTML = '<i class="fas fa-copy"></i> نسخ'; });
        }

        function copyResult(elementId, button) {
            const text = document.getElementById(elementId).textContent;
            if (text === 'اختر البيانات لإنشاء الكود') return;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => { showCopiedFeedback(button); }).catch(() => {
                    fallbackCopy(text, button); });
            } else { fallbackCopy(text, button); }
        }

        function fallbackCopy(text, button) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            try { document.execCommand('copy');
                showCopiedFeedback(button); } catch (e) { alert('فشل النسخ.'); }
            document.body.removeChild(ta);
        }

        function showCopiedFeedback(button) {
            const orig = button.innerHTML;
            button.innerHTML = '<i class="fas fa-check"></i> تم النسخ';
            button.classList.add('copied');
            setTimeout(() => { button.innerHTML = orig;
                button.classList.remove('copied'); }, 2500);
        }

        document.addEventListener('DOMContentLoaded', function() {
            populateNumberSelect();
            updateResult();
            document.getElementById('roleSelect').addEventListener('change', updateResult);
            document.getElementById('numberSelect').addEventListener('change', updateResult);
            document.getElementById('idCode').addEventListener('input', updateResult);
        });

        // جعل الدوال عامة
        window.addQuestion = addQuestion;
        window.addReply = addReply;
        window.toggleReplyForm = toggleReplyForm;
        window.copyResult = copyResult;
        window.showContent = showContent;
        window.goHome = goHome;
        console.log('🚀 الموقع جاهز مع الشعار المكبر!');
    </script>
